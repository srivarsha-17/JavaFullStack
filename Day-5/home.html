    <title>Document</title>
    <style>
        *{
            margin : 0;
        }
        #nav{
            display : flex;
            justify-content: space-around;
            align-items: center;
            /* background-color: aqua; */

            width : 100vw;

        }
        #back{
            width: 100%;
            height : 100%;

        }
        #back {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Clips the video edge to fill the screen without stretching */

        #login{
            background-color: white;
        }

        #wel{
            position: relative;
            display : flex;
            align-items: center;
            justify-content: center;
            top : 100px;
            left : 100px;

        }

        #welcome{
            font-size: 40px;
            /* background-color: white; */
            border : 2px solid black;
            padding: 10px 20px;
            border-radius: 200px;


        }
        a{
            color : black;
            text-decoration: none;

        }
        
    </style>
</head>
<body>
    <div id = "nav">
        <div id="title">ThinkMart</div>

        <a class = "items" href = "first.html">Products</a>

    </div>
    <video id = "back" src = "e6d8da2a-cf0c-439c-bbd9-c8657eb46ff5.mp4" autoplay muted loop></video>
